<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Semaine">
<title>Ma Semaine 🌷</title>
<style>
:root{--pink:#f2a7c3;--lav:#c9b3f5;--ink:#3a2f3d;--mut:#8a7f8c;--card:#fff;--soft:#f7f0f8;--grad:linear-gradient(90deg,#f2a7c3,#c9b3f5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fdf1f5,#f3eefc);min-height:100vh;padding:env(safe-area-inset-top) 14px 40px}
header{padding:18px 6px 6px}.kick{color:#c98aa8;font-weight:800;letter-spacing:2px;font-size:12px}
h1{margin:6px 0;font-size:32px}.sub{color:var(--mut);margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(#fdf1f5ee,#fdf1f5cc);backdrop-filter:blur(8px)}
.tab{flex:0 0 auto;border:0;background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px #c9b3f522;font-size:14px}
.tab.on{background:var(--grad);color:#fff}
.card{background:var(--card);border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #c9b3f522}
.card h2{margin:0 0 10px;font-size:20px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:14px;padding:9px 13px;font-weight:700;background:#efe8fb;color:#5b4a8a;font-size:14px}
.btn.p{background:var(--grad);color:#fff}.btn.s{background:#f7eef2;color:#6d5a66;padding:6px 10px;font-size:12px}
.btn.d{background:#fbeee9;color:#a14a3a}
input,select,textarea{font:inherit;border:1.5px solid #eadff0;border-radius:14px;padding:10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:90px}
.bar{height:12px;background:#f1e7ee;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--grad);border-radius:9px}
.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f1e6ee}.task:last-child{border:0}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #e7c9d6;flex:0 0 auto;display:grid;place-items:center;background:#fff;font-weight:900;color:#2b6b4a}
.chk.on{background:#9fdcbc;border-color:#9fdcbc}
.tt{font-weight:700}.done .tt{text-decoration:line-through;color:var(--mut)}
.pill{font-size:12px;border-radius:10px;padding:3px 8px;background:#fdeef3;color:#a0607a;font-weight:600}
.cat-Maison{background:#fde4ee;color:#b0446f}.cat-Admin{background:#e6efff;color:#3d5fa8}.cat-Sport{background:#e3f6ec;color:#2f7a52}.cat-Chat{background:#fff1dc;color:#a8691d}.cat-Perso{background:#efe6fd;color:#6a48b0}
.mut{color:var(--mut);font-size:13px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mday{background:#fff;border-radius:12px;min-height:70px;padding:5px;font-size:11px;border:1.5px solid #f3e8f0;overflow:hidden}
.mday.out{opacity:.4}.mday.today{border-color:var(--pink);background:#fff5f9}
.mday b{font-size:13px}.dot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;padding:1px 4px;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wday{background:#fff;border-radius:20px;padding:12px;box-shadow:0 3px 12px #c9b3f51c}.wday.today{outline:2px solid var(--pink)}
.wday li{font-size:13px;margin:4px 0}.wday ul{padding-left:16px;margin:6px 0}
.timer{font-size:64px;font-weight:800;text-align:center;margin:10px 0;background:var(--grad);-webkit-background-clip:text;color:transparent}
.stat{background:linear-gradient(135deg,#fdf0d9,#fbe3ee);border-radius:18px;padding:14px;flex:1;min-width:130px}.stat b{font-size:26px;display:block}
.badge{display:inline-block;background:#efe6fd;color:#5b4a8a;border-radius:14px;padding:6px 10px;margin:3px;font-weight:700;font-size:13px}
.boost{background:linear-gradient(90deg,#fdf0d0,#fbe3ee);border-radius:18px;padding:14px;font-weight:700}
.alert{background:#fff1dc;border-radius:16px;padding:12px;margin:8px 0;font-weight:600;color:#8a5414}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.chart div{flex:1;background:var(--grad);border-radius:8px 8px 3px 3px;position:relative;min-height:3px}
.chart span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.hide{display:none}.flemme{width:100%;padding:16px;font-size:17px;margin-top:8px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
</style></head><body>
<header><div class="kick">✨ TA SEMAINE EN DOUCEUR</div><h1>Ma Semaine 🌷</h1>
<p class="sub">Petits pas · vraies victoires 💗</p></header>
<script>
const K='maSemaine_v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],done:{},stars:0,hist:[],memo:'',weights:[],sess:{},goal:3,cat:[{id:1,name:'Croquettes 🥣',buys:[]},{id:2,name:'Litière 🪣',buys:[]},{id:3,name:'Pâtée 🐟',buys:[]}],reviews:{}};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const CATS=['Perso','Maison','Admin','Sport','Chat'];
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const uid=()=>Date.now()+Math.floor(Math.random()*999);
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
const monday=s=>{const d=P(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const fr=s=>P(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='Accueil',curDay=TODAY(),curWeek=monday(TODAY()),curMonth=TODAY().slice(0,7);

function occurs(t,ds){
  if(!t.recur) return t.date===ds;
  if(ds<t.recur.start) return false;
  const d=P(ds),r=t.recur;
  if(r.type==='daily') return true;
  if(r.type==='weekly') return r.days.includes(d.getDay());
  if(r.type==='biweekly'){const w=Math.round((P(monday(ds))-P(monday(r.start)))/6048e5);return w%2===0&&r.days.includes(d.getDay())}
  if(r.type==='monthly') return d.getDate()===P(r.start).getDate();
  return false}
const tasksOn=ds=>S.tasks.filter(t=>occurs(t,ds)).sort((a,b)=>(b.prio?1:0)-(a.prio?1:0));
const isDone=(t,ds)=>!!S.done[t.id+'|'+ds];
function toggle(id,ds){const k=id+'|'+ds;if(S.done[k]){delete S.done[k];S.stars=Math.max(0,S.stars-1)}else{S.done[k]=Date.now();S.stars++;const t=S.tasks.find(x=>x.id==id);S.hist.unshift({t:t.title,d:Date.now(),est:t.dur,real:null})}save();render()}

function newTask(o={}){
  const title=prompt('Nom de la tâche ?');if(!title)return null;
  const dur=parseInt(prompt('Durée estimée (minutes) ?','15'))||15;
  const c=prompt('Catégorie : '+CATS.join(', '),o.cat||'Perso');
  const cat=CATS.find(x=>x.toLowerCase()===(c||'').trim().toLowerCase())||'Perso';
  const prio=confirm('Prioritaire ⭐ ?');
  const t={id:uid(),title,dur,cat,prio,date:o.date??null,recur:o.recur||null};
  S.tasks.push(t);save();render();return t}
function editTask(id){const t=S.tasks.find(x=>x.id==id);const n=prompt('Nouveau nom',t.title);if(n===null)return;t.title=n||t.title;t.dur=parseInt(prompt('Durée (min)',t.dur))||t.dur;t.prio=confirm('Prioritaire ⭐ ?');save();render()}
function delTask(id){if(confirm('Supprimer cette tâche ?')){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}}
function planTask(id){const t=S.tasks.find(x=>x.id==id);const d=prompt('Pour quel jour ? (AAAA-MM-JJ)',TODAY());if(d&&/^\d{4}-\d\d-\d\d$/.test(d)){t.date=d;save();render()}}

function taskRow(t,ds,opts=''){
  const dn=ds&&isDone(t,ds);
  return `<div class="task ${dn?'done':''}">${ds?`<button class="chk ${dn?'on':''}" onclick="toggle(${t.id},'${ds}')">${dn?'✓':''}</button>`:''}
  <div class="sp"><div class="row"><span class="tt">${t.prio?'⭐ ':''}${esc(t.title)}</span><span class="sp"></span><span class="pill">${t.dur} min</span></div>
  <div class="row" style="margin-top:6px"><span class="pill cat-${t.cat}">${t.cat}</span>${t.recur?'<span class="pill">🔁</span>':''}
  ${!dn?`<button class="btn s" onclick="startFocus(${t.id},'${ds||TODAY()}')">🎯 Focus</button>`:''}${opts}
  <button class="btn s" onclick="editTask(${t.id})">Modifier</button><button class="btn s" onclick="delTask(${t.id})">Supprimer</button></div></div></div>`}

function progressCard(ds){const l=tasksOn(ds),d=l.filter(t=>isDone(t,ds)).length,p=l.length?Math.round(d/l.length*100):0;
  return `<div class="card"><div class="row"><div><h2 style="margin:0">${p===100&&l.length?'Bravo ! 🎉':'Tu avances !'}</h2><div class="mut">${d} tâches sur ${l.length} terminées</div></div><span class="sp"></span><b style="font-size:30px">${p}%</b></div>
  <div class="bar" style="margin:12px 0 6px"><i style="width:${p}%"></i></div><div class="row mut"><span>${l.length-d} restantes</span><span class="sp"></span><span>⭐ ${S.stars} étoiles</span></div></div>`}
const MSG=['Une étape à la fois ! ✨','Même 5 minutes, ça compte 💗','Tu fais de ton mieux, et c\'est déjà beaucoup 🌸','Petit pas aujourd\'hui, grande fierté demain 🌷'];

function vAccueil(){const ds=TODAY();
  return catAlerts()+progressCard(ds)+`<div class="card"><h2>🙈 J'ai la flemme</h2><div class="mut">Je choisis pour toi la tâche la plus courte et je lance le minuteur.</div><button class="btn p flemme" onclick="flemme()">Ok, vas-y, choisis pour moi</button></div>
  <div class="card"><div class="row"><h2 style="margin:0">📋 Aujourd'hui</h2><span class="sp"></span><button class="btn" onclick="newTask({date:TODAY()})">+ Ajouter</button></div>
  <div class="mut">${fr(ds)}</div>${tasksOn(ds).map(t=>taskRow(t,ds)).join('')||'<p class="mut">Rien de prévu, profite 🌸</p>'}</div>
  <div class="card"><h2>💖 Pense-bête</h2><div class="boost">${MSG[new Date().getDate()%MSG.length]}</div>
  <textarea style="margin-top:10px" placeholder="Note ici tout ce qui te passe par la tête..." oninput="S.memo=this.value;save()">${esc(S.memo)}</textarea></div>`}

function vMois(){const [y,m]=curMonth.split('-').map(Number);const first=new Date(y,m-1,1);let d=monday(iso(first));const cells=[];
  for(let i=0;i<42;i++){const ds=add(d,i);const l=tasksOn(ds);
    cells.push(`<div class="mday ${ds.slice(0,7)!==curMonth?'out':''} ${ds===TODAY()?'today':''}" onclick="curDay='${ds}';go('Jour')"><b>${P(ds).getDate()}</b>${l.slice(0,3).map(t=>`<span class="dot cat-${t.cat}" style="${isDone(t,ds)?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</span>`).join('')}${l.length>3?`<span class="mut">+${l.length-3}</span>`:''}</div>`)}
  return `<div class="card"><div class="row"><button class="btn" onclick="shiftMonth(-1)">‹</button><span class="sp" style="text-align:center"><h2 style="margin:0;text-transform:capitalize">${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2></span><button class="btn" onclick="shiftMonth(1)">›</button></div>
  <div class="grid7" style="margin-top:12px">${['L','M','M','J','V','S','D'].map(x=>`<div class="mut" style="text-align:center">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function shiftMonth(n){const[y,m]=curMonth.split('-').map(Number);curMonth=iso(new Date(y,m-1+n,1)).slice(0,7);render()}

function vSemaine(){let tot=0,dn=0;const days=[...Array(7)].map((_,i)=>{const ds=add(curWeek,i),l=tasksOn(ds);tot+=l.length;dn+=l.filter(t=>isDone(t,ds)).length;
  return `<div class="wday ${ds===TODAY()?'today':''}"><div class="row"><b style="text-transform:capitalize">${P(ds).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</b><span class="sp"></span><button class="btn s" onclick="curDay='${ds}';go('Jour')">Voir</button></div>
  <ul>${l.map(t=>`<li style="${isDone(t,ds)?'text-decoration:line-through;color:#aaa':''}">${t.prio?'⭐':''}${esc(t.title)}</li>`).join('')||'<li class="mut">Libre 🌸</li>'}</ul></div>`});
  const wk=curWeek,rv=S.reviews[wk]||'';
  return `<div class="card"><div class="row"><button class="btn" onclick="curWeek=add(curWeek,-7);render()">‹</button><span class="sp" style="text-align:center"><h2 style="margin:0">Semaine du ${P(curWeek).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</h2></span><button class="btn" onclick="curWeek=add(curWeek,7);render()">›</button></div>
  <div class="bar" style="margin-top:12px"><i style="width:${tot?dn/tot*100:0}%"></i></div><div class="mut" style="margin-top:6px">${dn}/${tot} tâches faites cette semaine</div></div>
  <div class="week">${days.join('')}</div>
  <div class="card"><h2>🌙 Bilan du dimanche</h2><div class="boost">${tot?(dn/tot>=.7?'Super semaine, sois fière de toi ! 🎉':dn/tot>=.4?'Belle semaine, tu avances 💗':'Semaine plus dure, et c\'est ok. On repart doucement 🌱'):'Semaine encore vide, prépare-la tranquillement ✨'}</div>
  ${streakTop()}
  <div class="mut" style="margin-top:10px">Ce qui a bien marché, ce que je change la semaine prochaine :</div>
  <textarea oninput="S.reviews['${wk}']=this.value;save()">${esc(rv)}</textarea></div>`}

function vJour(){const ds=curDay,l=tasksOn(ds);
  return `<div class="card"><div class="row"><button class="btn" onclick="curDay=add(curDay,-1);render()">‹</button><span class="sp" style="text-align:center"><h2 style="margin:0;text-transform:capitalize">${fr(ds)}</h2></span><button class="btn" onclick="curDay=add(curDay,1);render()">›</button></div>
  <input type="date" value="${ds}" style="margin-top:10px" onchange="curDay=this.value;render()"></div>${progressCard(ds)}
  <div class="card"><div class="row"><h2 style="margin:0">Ma to-do</h2><span class="sp"></span><button class="btn" onclick="newTask({date:curDay})">+ Ajouter</button></div>
  ${l.map(t=>taskRow(t,ds)).join('')||'<p class="mut">Aucune tâche ce jour-là.</p>'}
  <button class="btn" style="margin-top:10px" onclick="copyDay()">📋 Copier cette to-do vers un autre jour</button></div>`}
function copyDay(){const to=prompt('Copier vers quel jour ? (AAAA-MM-JJ)',add(curDay,1));if(!to||!/^\d{4}-\d\d-\d\d$/.test(to))return;
  S.tasks.filter(t=>!t.recur&&t.date===curDay).forEach(t=>S.tasks.push({...t,id:uid(),date:to}));save();curDay=to;render()}

function vTodo(){const l=S.tasks.filter(t=>!t.recur&&!t.date).sort((a,b)=>(b.prio?1:0)-(a.prio?1:0));
  return `<div class="card"><div class="row"><h2 style="margin:0">📝 Ma to-do générale</h2><span class="sp"></span><button class="btn p" onclick="newTask()">+ Ajouter</button></div>
  <div class="mut">Les choses à faire sans date. Planifie-les quand tu veux.</div>
  ${l.map(t=>taskRow(t,null,`<button class="btn s" onclick="planTask(${t.id})">📅 Envoyer vers un jour</button>`)).join('')||'<p class="mut">Tout est planifié, bravo 🌷</p>'}</div>`}

function streak(t){let n=0,ds=TODAY();if(!isDone(t,ds))ds=add(ds,-1);for(let i=0;i<400;i++){if(occurs(t,ds)){if(isDone(t,ds))n++;else break}if(ds<t.recur.start)break;ds=add(ds,-1)}return n}
function streakTop(){const r=S.tasks.filter(t=>t.recur).map(t=>[t,streak(t)]).sort((a,b)=>b[1]-a[1]);return r.length&&r[0][1]?`<p>🔥 Meilleure série : <b>${esc(r[0][0].title)}</b>, ${r[0][1]} fois d'affilée</p>`:''}
function newRoutine(){const ty=prompt('Fréquence : tous les jours (1), certains jours chaque semaine (2), toutes les 2 semaines (3), une fois par mois (4)','1');
  const type={1:'daily',2:'weekly',3:'biweekly',4:'monthly'}[ty];if(!type)return;let days=[];
  if(type==='weekly'||type==='biweekly'){const s=prompt('Quels jours ? (ex : lun, jeu)','lun');days=(s||'').toLowerCase().split(/[ ,]+/).map(x=>['dim','lun','mar','mer','jeu','ven','sam'].indexOf(x.slice(0,3))).filter(x=>x>=0);if(!days.length)return}
  newTask({recur:{type,days,start:TODAY()}})}
const FREQ=t=>({daily:'Tous les jours',weekly:'Chaque '+t.recur.days.map(d=>JOURS[d]).join(', '),biweekly:'Une semaine sur deux · '+t.recur.days.map(d=>JOURS[d]).join(', '),monthly:'Le '+P(t.recur.start).getDate()+' de chaque mois'}[t.recur.type]);
function vRoutines(){const l=S.tasks.filter(t=>t.recur),ds=TODAY();
  return `<div class="card"><div class="row"><h2 style="margin:0">🔁 Mes routines</h2><span class="sp"></span><button class="btn p" onclick="newRoutine()">+ Ajouter</button></div>
  <div class="mut">Elles apparaissent toutes seules dans les bons jours.</div>
  ${l.map(t=>{const s=streak(t);return `<div><div class="mut" style="margin-top:10px">${FREQ(t)} ${s?`· 🔥 ${s} d'affilée`:''}</div>${taskRow(t,occurs(t,ds)?ds:null)}</div>`}).join('')||'<p class="mut">Pas encore de routine.</p>'}</div>`}

let F={id:null,ds:null,left:0,run:false,start:null,iv:null};
function startFocus(id,ds){const t=S.tasks.find(x=>x.id==id);clearInterval(F.iv);F={id,ds,left:t.dur*60,run:true,start:Date.now(),iv:null};F.iv=setInterval(tick,1000);go('Focus')}
function tick(){if(!F.run)return;F.left--;if(F.left<=0){F.left=0;F.run=false;try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}alert('⏰ Temps écoulé ! Tu as terminé ?')}const el=document.getElementById('tm');if(el)el.textContent=fmt(F.left)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function focusDone(){const t=S.tasks.find(x=>x.id==F.id);if(!t)return;const real=Math.round((Date.now()-F.start)/60000);
  if(!isDone(t,F.ds)){S.done[t.id+'|'+F.ds]=Date.now();S.stars+=2;S.hist.unshift({t:t.title,d:Date.now(),est:t.dur,real})}
  clearInterval(F.iv);F={id:null};save();alert('Bravo ! 🎉 +2 étoiles');go('Accueil')}
function flemme(){const ds=TODAY(),l=tasksOn(ds).filter(t=>!isDone(t,ds)).sort((a,b)=>a.dur-b.dur);if(!l.length){alert('Tout est fait aujourd\'hui, repose-toi 🌸');return}startFocus(l[0].id,ds)}
function vFocus(){const t=S.tasks.find(x=>x.id==F.id);
  if(!t){const l=tasksOn(TODAY()).filter(x=>!isDone(x,TODAY()));return `<div class="card"><h2>🎯 Focus</h2><div class="mut">Choisis une seule tâche. Juste celle-là.</div>${l.map(x=>`<div class="task"><span class="sp tt">${esc(x.title)}</span><button class="btn p" onclick="startFocus(${x.id},TODAY())">Lancer</button></div>`).join('')||'<p class="mut">Rien à faire aujourd\'hui 🌷</p>'}<button class="btn flemme" onclick="flemme()">🙈 J'ai la flemme, choisis pour moi</button></div>`}
  return `<div class="card" style="text-align:center"><div class="kick">EN CE MOMENT</div><h2>${esc(t.title)}</h2><div class="timer" id="tm">${fmt(F.left)}</div>
  <div class="boost">Juste cette tâche. Rien d'autre n'existe 💗</div><div class="row" style="justify-content:center;margin-top:14px">
  <button class="btn" onclick="F.run=!F.run;render()">${F.run?'⏸ Pause':'▶️ Reprendre'}</button><button class="btn" onclick="F.left+=300;render()">+5 min</button>
  <button class="btn p" onclick="focusDone()">✅ Terminé</button><button class="btn d" onclick="clearInterval(F.iv);F={id:null};render()">Arrêter</button></div>
  <p class="mut">Garde la page ouverte. Pour une alerte fiable, lance aussi le minuteur de l'iPad.</p></div>`}

function weekCounts(n){const out=[];let m=monday(TODAY());for(let i=n-1;i>=0;i--){const w=add(m,-7*i);let c=0;for(let j=0;j<7;j++){const ds=add(w,j);S.tasks.forEach(t=>{if(isDone(t,ds))c++})}out.push([w,c])}return out}
function chart(data,lab){const mx=Math.max(1,...data.map(d=>d[1]));return `<div class="chart">${data.map(d=>`<div style="height:${d[1]/mx*100}%" title="${d[1]}"><span>${lab(d[0])}</span></div>`).join('')}</div><div style="height:16px"></div>`}
function vProgres(){const nd=Object.keys(S.done).length,wc=weekCounts(8);
  const B=[[1,'🌱 Premier pas'],[5,'🍓 5 petites victoires'],[20,'🌸 20 tâches'],[50,'🦋 50 tâches'],[100,'👑 100 tâches']].filter(b=>nd>=b[0]);
  const focusH=S.hist.filter(h=>h.real!=null);
  return `<div class="card"><h2>🏆 Mes progrès</h2><div class="row"><div class="stat">Étoiles<b>${S.stars} ⭐</b></div><div class="stat">Tâches faites<b>${nd}</b></div></div>
  <p><b>Mes badges</b></p>${B.map(b=>`<span class="badge">${b[1]}</span>`).join('')||'<span class="mut">Ton premier badge arrive vite !</span>'}</div>
  <div class="card"><h2>📈 Tâches faites par semaine</h2><div class="mut">Tes 8 dernières semaines.</div>${chart(wc,w=>P(w).getDate()+'/'+(P(w).getMonth()+1))}</div>
  <div class="card"><h2>🔥 Mes séries</h2>${S.tasks.filter(t=>t.recur).map(t=>`<div class="task"><span class="sp">${esc(t.title)}</span><span class="pill">🔥 ${streak(t)}</span></div>`).join('')||'<p class="mut">Ajoute des routines pour voir tes séries.</p>'}</div>
  <div class="card"><h2>⏱️ Estimé vs réel</h2><div class="mut">En mode focus, tu vois si tu estimes bien tes durées.</div>
  ${focusH.slice(0,15).map(h=>`<div class="task"><div class="sp"><div class="tt">${esc(h.t)}</div><div class="mut">${new Date(h.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} · estimé ${h.est} min · réel ${h.real} min ${h.real<=h.est?'💪':''}</div></div></div>`).join('')||'<p class="mut">Pas encore de focus terminé.</p>'}</div>`}

function vSport(){const wk=monday(TODAY()),n=S.sess[wk]||0,ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  let svg='';if(ws.length>1){const v=ws.map(w=>w.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1;const pts=ws.map((w,i)=>`${i/(ws.length-1)*300},${110-(w.kg-mn)/(mx-mn)*100}`).join(' ');
    svg=`<svg viewBox="-5 0 310 120" style="width:100%;margin-top:10px"><defs><linearGradient id="g"><stop offset="0" stop-color="#f2a7c3"/><stop offset="1" stop-color="#c9b3f5"/></linearGradient></defs><polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${ws.map((w,i)=>`<circle cx="${i/(ws.length-1)*300}" cy="${110-(w.kg-mn)/(mx-mn)*100}" r="4" fill="#c9b3f5"/>`).join('')}</svg>`}
  const diff=ws.length>1?(ws[ws.length-1].kg-ws[0].kg).toFixed(1):null;
  const sw=[];for(let i=7;i>=0;i--){const w=add(wk,-7*i);sw.push([w,S.sess[w]||0])}
  return `<div class="card"><h2>💪 Séances cette semaine</h2><div class="row"><button class="btn" onclick="S.sess['${wk}']=Math.max(0,${n}-1);save();render()">−</button><b style="font-size:34px;margin:0 10px">${n}</b><span class="mut">/ objectif ${S.goal}</span><span class="sp"></span><button class="btn p" onclick="S.sess['${wk}']=${n}+1;S.stars++;save();render()">+ Séance</button></div>
  <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,n/S.goal*100)}%"></i></div>
  <button class="btn s" style="margin-top:10px" onclick="const g=parseInt(prompt('Objectif de séances par semaine ?',S.goal));if(g){S.goal=g;save();render()}">Changer l'objectif</button>
  ${chart(sw,w=>P(w).getDate()+'/'+(P(w).getMonth()+1))}</div>
  <div class="card"><div class="row"><h2 style="margin:0">⚖️ Mon poids</h2><span class="sp"></span><button class="btn p" onclick="const k=parseFloat((prompt('Poids du jour (kg) ?')||'').replace(',','.'));if(k){S.weights=S.weights.filter(w=>w.d!==TODAY());S.weights.push({d:TODAY(),kg:k});save();render()}">+ Ajouter</button></div>
  ${ws.length?`<div class="mut">Dernier : <b>${ws[ws.length-1].kg} kg</b>${diff!==null?` · ${diff>0?'+':''}${diff} kg depuis le début`:''}</div>`:'<p class="mut">Ajoute ta première pesée.</p>'}${svg}
  ${ws.slice(-6).reverse().map(w=>`<div class="task"><span class="sp">${fr(w.d)}</span><b>${w.kg} kg</b><button class="btn s" onclick="S.weights=S.weights.filter(x=>x.d!=='${w.d}');save();render()">✕</button></div>`).join('')}</div>`}

function catInfo(it){const b=[...it.buys].sort();if(b.length<2)return{avg:null,next:null};let s=0;for(let i=1;i<b.length;i++)s+=(P(b[i])-P(b[i-1]))/864e5;const avg=Math.round(s/(b.length-1));return{avg,next:add(b[b.length-1],avg)}}
function catAlerts(){return S.cat.map(it=>{const c=catInfo(it);if(!c.next)return'';const left=Math.round((P(c.next)-P(TODAY()))/864e5);return left<=3?`<div class="alert">🐱 ${esc(it.name)} : ${left<0?'normalement épuisé, pense à racheter !':left===0?'à racheter aujourd\'hui':'à racheter dans '+left+' jour'+(left>1?'s':'')}</div>`:''}).join('')}
function vChat(){return catAlerts()+`<div class="card"><div class="row"><h2 style="margin:0">🐱 Courses du chat</h2><span class="sp"></span><button class="btn" onclick="const n=prompt('Nouvel article ?');if(n){S.cat.push({id:uid(),name:n,buys:[]});save();render()}">+ Article</button></div>
  <div class="mut">Clique sur « Acheté » à chaque achat. Après 2 achats, je calcule ton rythme et je te préviens 3 jours avant.</div>
  ${S.cat.map(it=>{const c=catInfo(it),last=[...it.buys].sort().pop();return `<div class="task"><div class="sp"><div class="tt">${esc(it.name)}</div><div class="mut">${last?'Dernier achat : '+fr(last):'Jamais acheté encore'}${c.avg?` · tous les ~${c.avg} jours · prochain vers le ${P(c.next).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`:''}</div>
  <div class="row" style="margin-top:6px"><button class="btn p" onclick="S.cat.find(x=>x.id==${it.id}).buys.push(TODAY());save();render()">🛒 Acheté</button><button class="btn s" onclick="const d=prompt('Date de l\\'achat (AAAA-MM-JJ)',TODAY());if(d){S.cat.find(x=>x.id==${it.id}).buys.push(d);save();render()}">Autre date</button><button class="btn s" onclick="if(confirm('Supprimer ?')){S.cat=S.cat.filter(x=>x.id!=${it.id});save();render()}">Supprimer</button></div></div></div>`}).join('')}</div>`}

function vReglages(){return `<div class="card"><h2>💾 Sauvegarde</h2><div class="mut">Crée un fichier avec toutes tes données (range-le dans iCloud Drive), puis importe-le sur ton autre appareil.</div>
  <div class="row" style="margin-top:10px"><button class="btn p" onclick="exportData()">Sauvegarder</button><label class="btn">Importer<input type="file" accept=".json,application/json" class="hide" onchange="importData(this.files[0])"></label></div>
  <button class="btn d" style="margin-top:14px;width:100%" onclick="if(confirm('Tout effacer ? Pense à sauvegarder avant.')){localStorage.removeItem('${K}');location.reload()}">Réinitialiser les données</button></div>`}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ma-semaine-'+TODAY()+'.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks)throw 0;if(confirm('Remplacer les données de cet appareil par celles du fichier ?')){S=d;save();render();alert('Importé ! 🎉')}}catch(e){alert('Fichier non reconnu 😕')}};r.readAsText(f)}

const TABS={Accueil:['🏡',vAccueil],Mois:['🗓️',vMois],Semaine:['📆',vSemaine],Jour:['☀️',vJour],'To-do':['📝',vTodo],Routines:['🔁',vRoutines],Focus:['🎯',vFocus],'Progrès':['🏆',vProgres],Sport:['💪',vSport],Chat:['🐱',vChat],'Réglages':['💾',vReglages]};
function go(t){tab=t;render();scrollTo(0,0)}
function render(){document.getElementById('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab ${k===tab?'on':''}" onclick="go('${k}')">${v[0]} ${k}</button>`).join('');document.getElementById('app').innerHTML=TABS[tab][1]()}
render();
</script></body></html>
