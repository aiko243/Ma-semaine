<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#fdf1f5">
<meta name="apple-mobile-web-app-title" content="Ma Semaine">
<title>Ma Semaine 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f2a7c3;--lav:#c9b3f5;--ink:#3a2f3d;--mut:#8a7f8c;--card:#fff;--soft:#f7f0f8;--grad:linear-gradient(90deg,#f2a7c3,#c9b3f5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fdf1f5,#f3eefc);min-height:100vh;padding:env(safe-area-inset-top) 14px 40px}
header{padding:18px 6px 6px}.kick{color:#c98aa8;font-weight:800;letter-spacing:2px;font-size:12px}
h1{margin:6px 0;font-size:32px}.sub{color:var(--mut);margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(#fdf1f5ee,#fdf1f5cc);backdrop-filter:blur(8px)}
.tab{flex:0 0 auto;border:0;background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px #c9b3f522;font-size:14px}
.tab.on{background:var(--grad);color:#fff}
.card{background:var(--card);border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #c9b3f522}
.card h2{margin:0 0 10px;font-size:20px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:14px;padding:9px 13px;font-weight:700;background:#efe8fb;color:#5b4a8a;font-size:14px}
.btn.p{background:var(--grad);color:#fff}.btn.s{background:#f7eef2;color:#6d5a66;padding:6px 10px;font-size:12px}
.btn.d{background:#fbeee9;color:#a14a3a}
input,select,textarea{font:inherit;border:1.5px solid #eadff0;border-radius:14px;padding:10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:90px}
.bar{height:12px;background:#f1e7ee;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--grad);border-radius:9px}
.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f1e6ee}.task:last-child{border:0}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #e7c9d6;flex:0 0 auto;display:grid;place-items:center;background:#fff;font-weight:900;color:#2b6b4a}
.chk.on{background:#9fdcbc;border-color:#9fdcbc}
.tt{font-weight:700}.done .tt{text-decoration:line-through;color:var(--mut)}
.pill{font-size:12px;border-radius:10px;padding:3px 8px;background:#fdeef3;color:#a0607a;font-weight:600}
.cat-Maison{background:#fde4ee;color:#b0446f}.cat-Administratif{background:#e6efff;color:#3d5fa8}.cat-Sport{background:#e3f6ec;color:#2f7a52}.cat-Chat{background:#fff1dc;color:#a8691d}.cat-Perso{background:#efe6fd;color:#6a48b0}
.mut{color:var(--mut);font-size:13px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mday{background:#fff;border-radius:12px;min-height:70px;padding:5px;font-size:11px;border:1.5px solid #f3e8f0;overflow:hidden}
.mday.out{opacity:.4}.mday.today{border-color:var(--pink);background:#fff5f9}
.mday b{font-size:13px}.dot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;padding:1px 4px;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wday{background:#fff;border-radius:20px;padding:12px;box-shadow:0 3px 12px #c9b3f51c}.wday.today{outline:2px solid var(--pink)}
.wday li{font-size:13px;margin:4px 0}.wday ul{padding-left:16px;margin:6px 0}
.timer{font-size:64px;font-weight:800;text-align:center;margin:10px 0;background:var(--grad);-webkit-background-clip:text;color:transparent}
.stat{background:linear-gradient(135deg,#fdf0d9,#fbe3ee);border-radius:18px;padding:14px;flex:1;min-width:130px}.stat b{font-size:26px;display:block}
.badge{display:inline-block;background:#efe6fd;color:#5b4a8a;border-radius:14px;padding:6px 10px;margin:3px;font-weight:700;font-size:13px}
.boost{background:linear-gradient(90deg,#fdf0d0,#fbe3ee);border-radius:18px;padding:14px;font-weight:700}
.alert{background:#fff1dc;border-radius:16px;padding:12px;margin:8px 0;font-weight:600;color:#8a5414}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.chart div{flex:1;background:var(--grad);border-radius:8px 8px 3px 3px;position:relative;min-height:3px}
.chart span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.hide{display:none}.flemme{width:100%;padding:16px;font-size:17px;margin-top:8px}
.postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:12px}
.pi{position:relative;min-height:130px;padding:20px 12px 12px;border-radius:4px 4px 14px 4px;box-shadow:0 6px 14px #a07ab822;transform:rotate(-1.6deg)}
.pi:nth-child(even){transform:rotate(1.4deg)}.pi:nth-child(3n){transform:rotate(-.6deg)}
.pi::before{content:'';position:absolute;top:-8px;left:50%;width:56px;height:18px;margin-left:-28px;background:#ffffffaa;border-radius:3px;transform:rotate(-3deg);box-shadow:0 1px 3px #0001}
.pi textarea{border:0;min-height:104px;padding:0 2px;resize:none;font-family:var(--hand);font-size:21px;line-height:26px;border-radius:0;background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--pl,#00000024) 25px 26px);background-attachment:local}
.pi .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:16px;color:#0006}
.c0{background:#ffd6e7}.c1{background:#e4d7ff}.c2{background:#fff3b8}.c3{background:#d3f5e4}.c4{background:#ffe0cc}
.sel{width:auto;padding:7px 9px;border-radius:12px;font-weight:700}
:root{--hand:'Caveat','Noteworthy','Bradley Hand',-apple-system,system-ui,sans-serif;--note:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif}
body{font-family:var(--note);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background-color:#fffaf4;background-image:radial-gradient(#ead9e6 1.1px,transparent 1.2px),linear-gradient(180deg,#fdeef4 0%,#fffaf4 30%,#f4eefc 100%);background-size:20px 20px,100% 100%;background-attachment:fixed}
h1{font-family:var(--hand);font-size:50px;font-weight:700;line-height:1;margin:4px 0 6px}
.kick{font-family:var(--note);font-size:11px;font-weight:700;letter-spacing:3px}
.card{position:relative;background:#fffdf9;border-radius:6px 18px 8px 16px;border:1px solid #f1e4ea;box-shadow:0 1px 0 #fff inset,3px 6px 16px #b48aa522;padding:24px 18px 18px;margin:22px 2px}
.card::before{content:'';position:absolute;top:-11px;left:22px;width:92px;height:22px;transform:rotate(-4deg);opacity:.85;border-radius:2px;
 background:repeating-linear-gradient(45deg,#f6b8cf 0 7px,#fbd5e3 7px 14px);box-shadow:0 1px 2px #0000000d}
.card:nth-of-type(3n+2)::before{left:auto;right:26px;transform:rotate(5deg);background:repeating-linear-gradient(90deg,#d4c2f7 0 6px,#e9defc 6px 12px)}
.card:nth-of-type(3n)::before{left:40%;transform:rotate(-2deg);background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/10px 10px,#c9e9da}
.card h2{font-family:var(--hand);font-size:32px;font-weight:700;line-height:1.05;letter-spacing:.2px}
.tt{font-family:var(--note);font-size:16px;font-weight:600;line-height:1.3}
.tab{font-family:var(--note);font-weight:600;font-size:14px;border-radius:10px 10px 4px 4px;border:1px solid #f0e2ea}
.tab.on{transform:translateY(-2px) rotate(-1deg)}
.btn{font-family:var(--note);font-weight:600;font-size:14px}
.boost{font-family:var(--hand);font-size:26px;font-weight:600;line-height:1.15;background:linear-gradient(90deg,#fff3c4,#fde3ee);border-radius:4px;transform:rotate(-.6deg)}
.chk{border-radius:7px;border-style:dashed}
.chk.on{border-style:solid}
/* planner header */
.ph{display:flex;align-items:center;gap:16px;padding-top:28px}
.stamp{flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 5px #fff,0 0 0 7px #f2c4d8,4px 8px 16px #b48aa533;transform:rotate(-6deg)}
.stamp b{font-family:var(--note);font-size:38px;font-weight:800;line-height:1;display:block;letter-spacing:-1px}.stamp small{font-family:var(--note);font-size:11px;font-weight:700;letter-spacing:2px}
.ph .wd{font-family:var(--hand);font-size:48px;font-weight:700;line-height:1;text-transform:capitalize}
.ph .mo{font-family:var(--note);color:var(--mut);font-size:14px;font-weight:500;margin-top:2px}
.stick{position:absolute;font-size:30px;filter:drop-shadow(1px 2px 1px #0002)}
.rline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed #f0dfe8}.rline:last-child{border:0}
.rline .tt{flex:1}.rline.done .tt{text-decoration:line-through;color:var(--mut)}
.lined{background-image:repeating-linear-gradient(transparent 0 33px,#f3dbe6 33px 34px)}
.lbl{display:inline-block;font-family:var(--note);background:#fff;border:1.5px solid #f2c4d8;border-radius:3px;padding:2px 10px;transform:rotate(-2deg);color:#b0446f;font-size:13px;font-weight:700}
/* ===== Journal + répertoire ===== */
:root{--tabw:50px}
body{padding:calc(env(safe-area-inset-top) + 10px) calc(var(--tabw) + env(safe-area-inset-right)) 30px calc(8px + env(safe-area-inset-left))}
#book{position:relative;perspective:2200px}
#page{position:relative;background:#fffcfa;border-radius:10px 4px 4px 10px;padding:6px 14px 20px 34px;min-height:calc(100vh - 40px);
 box-shadow:0 0 0 1px #f1e3ea,4px 0 0 #fbf3f6,7px 0 0 #f1e3ea,9px 1px 0 #faf1f5,12px 2px 0 #eedfe7,6px 10px 30px #b48aa52e;
 background-image:linear-gradient(90deg,transparent 0 22px,#f6dbe6 22px 23.5px,transparent 23.5px)}
#page::before{content:'';position:absolute;left:5px;top:18px;bottom:18px;width:12px;
 background:radial-gradient(circle at 6px 6px,#efe2ea 0 4px,#d9c5d2 4px 5px,transparent 5.5px) 0 0/12px 34px}
.tabs{position:fixed;top:calc(env(safe-area-inset-top) + 34px);right:env(safe-area-inset-right);width:var(--tabw);bottom:20px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;overflow-x:visible;padding:0;background:none;backdrop-filter:none;z-index:10;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;writing-mode:vertical-rl;width:calc(var(--tabw) - 8px);margin-left:0;padding:12px 0 10px;border:0;border-radius:0 12px 12px 0;
 font-size:13px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;justify-content:flex-start;gap:6px;color:#5c4655;
 box-shadow:2px 2px 5px #b48aa52a,inset 4px 0 6px -4px #0000001a;transform:none!important;transition:width .2s,margin .2s}
.tab .ic{writing-mode:horizontal-tb;font-size:16px}
.tab.on{width:var(--tabw);margin-left:-8px;padding-left:8px;color:#4a3141;box-shadow:3px 3px 8px #b48aa540;background-image:none}
.tab.t0{background:#f8c9d8}.tab.t1{background:#e5d4f7}.tab.t2{background:#ffe1cc}.tab.t3{background:#d6ecdf}.tab.t4{background:#fff0bd}.tab.t5{background:#f6d3e6}
.tab.t6{background:#d9def7}.tab.t7{background:#f9d6cf}.tab.t8{background:#d3eee9}.tab.t9{background:#ecdcc8}.tab.t10{background:#efd9f0}
/* page qui tourne */
.turn{position:absolute;left:0;top:0;right:0;z-index:20;transform-origin:left center;backface-visibility:hidden;pointer-events:none;overflow:hidden;
 background:#fffcfa;border-radius:10px 4px 4px 10px;box-shadow:0 0 0 1px #f1e3ea}
.turn.fwd{animation:flipOut .55s cubic-bezier(.45,.05,.55,.95) forwards}
#page.back{transform-origin:left center;animation:flipIn .55s cubic-bezier(.45,.05,.55,.95)}
@keyframes flipOut{0%{transform:rotateY(0);filter:brightness(1);box-shadow:0 0 0 #0000}50%{box-shadow:-30px 10px 40px #6b4a5a40}60%{filter:brightness(.92)}100%{transform:rotateY(-100deg);filter:brightness(.8)}}
@keyframes flipIn{0%{transform:rotateY(-100deg);filter:brightness(.85)}100%{transform:rotateY(0);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.turn.fwd,#page.back{animation-duration:.01s}}
@media (max-width:500px){:root{--tabw:42px}#page{padding:4px 10px 18px 28px}.tab{font-size:11.5px;padding:10px 0 8px}.tab .ic{font-size:14px}h1{font-size:36px}}
body.sober #page{background:#252128;background-image:none;box-shadow:0 0 0 1px #37303a}
body.sober #page::before{background:radial-gradient(circle at 6px 6px,#1d1a1f 0 4px,#3e3641 4px 5px,transparent 5.5px) 0 0/12px 34px}
body.sober .tab{background:#2f2a33!important;color:#b9aebb;box-shadow:none}
body.sober .tab.on{background:#4a3a45!important;color:#f3e9ef}
body.sober .turn{background:#252128;box-shadow:none}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.stk{position:relative;border:1.5px dashed #ead5e2;background:#fff;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font:inherit;transition:transform .15s}
.stk .se{font-size:26px;line-height:1;filter:grayscale(.55) opacity(.7);transition:filter .15s}.stk .sn{font-size:11px;font-weight:600;color:var(--mut);text-align:center;line-height:1.15}
.stk.on{border:1.5px solid #f2a7c3;background:linear-gradient(160deg,#fff0f6,#f3ecff);transform:rotate(-2deg) scale(1.03);box-shadow:0 3px 8px #c9b3f544}
.stk.on:nth-child(even){transform:rotate(2deg) scale(1.03)}.stk.on .se{filter:none}.stk.on .sn{color:#8a4a68}
.stk .sx{position:absolute;top:2px;right:6px;font-size:11px;color:#b0446f}.stk.add .se{filter:none;color:#b98aa8}
.wstk{display:flex;flex-wrap:wrap;gap:2px;font-size:20px;margin:6px 0 2px}
.mstk{display:flex;flex-wrap:wrap;gap:0;font-size:13px;line-height:1.1;margin:2px 0 1px}
body.sober .stk{background:#2a252d;border-color:#3e3641}body.sober .stk.on{background:#3a3040;border-color:#b88fa3;transform:none;box-shadow:none}body.sober .stk.on .sn{color:#e2c1d2}
/* ===== Fiches (formulaires) ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#4a2f4a55;backdrop-filter:blur(3px)}
#sheet.open{display:flex}
#sheet .pan{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:#fffcfa;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #6b4a5a33;animation:up .25s ease-out}
@media (min-width:700px){#sheet{align-items:center}#sheet .pan{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:#ead6e2;margin:4px auto 10px}
#sheet h3{font-family:var(--hand);font-size:30px;margin:0 0 10px;color:var(--ink)}
.fl{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#b98aa8;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 12px;border-radius:14px;border:1.5px solid #eadff0;background:#fff;font-weight:600;font-size:14px;color:var(--mut)}
.chip input:checked+span{border-color:transparent;background:var(--grad);color:#fff}
.chip.c-Perso input:checked+span{background:#d9c4fb;color:#4c3480}.chip.c-Maison input:checked+span{background:#f9c6da;color:#8a2f57}.chip.c-Administratif input:checked+span{background:#c9d8fb;color:#2f4d8a}.chip.c-Sport input:checked+span{background:#bfe8d1;color:#245c3e}.chip.c-Chat input:checked+span{background:#ffe0b3;color:#80520f}
.qk{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fbtns{display:flex;gap:8px;margin-top:20px}.fbtns .btn{flex:1;padding:13px}
.hide2{display:none}
/* étapes */
.subs{margin:6px 0 2px;padding-left:2px}
.sub{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.sub .chk{width:20px;height:20px;border-radius:6px;font-size:11px}
.sub.on span{text-decoration:line-through;color:var(--mut)}
/* frise horaire */
.tl{position:relative;margin-top:8px}
.tlw{max-height:min(780px,62vh);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:8px;border-radius:14px;border:1px solid #f3e6ee;padding:0 6px;background:linear-gradient(#fff,#fff) padding-box}
body.sober .tlw{border-color:#3a333c;background:none}
.tl .h{position:absolute;left:0;right:0;border-top:1px dashed #efdfe8;font-size:11px;color:var(--mut);font-weight:600}
.tl .h span{position:absolute;top:-8px;left:0;background:var(--card);padding-right:4px}
.tl .ev{position:absolute;left:46px;right:4px;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600;overflow:hidden;box-shadow:0 2px 6px #b48aa522;border-left:4px solid #0002}
.tl .ev small{display:block;font-weight:500;opacity:.75;font-size:11px}
.tl .ev.dn{opacity:.5;text-decoration:line-through}
.tl .now{position:absolute;left:40px;right:0;height:2px;background:#f08bb0;z-index:3}.tl .now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#f08bb0}
.backup{background:linear-gradient(90deg,#fff3c4,#fde3ee);border-radius:18px;padding:14px;margin:14px 0}
body.sober #sheet .pan{background:#2a252d}body.sober .chip span{background:#221e24;border-color:#3e3641;color:#cbc1cb}
body.sober .tl .h{border-color:#3a333c}body.sober .tl .ev{box-shadow:none}body.sober .backup{background:#3d3427;color:#ecd2a3}
.fhead{cursor:pointer;-webkit-user-select:none;user-select:none}
.chev{display:inline-block;margin-left:8px;font-family:-apple-system,system-ui,sans-serif;font-size:22px;color:#c9a3b9;transition:transform .2s;transform:rotate(90deg)}
.card.fopen .chev{transform:rotate(-90deg)}
.card[data-fold]:not(.fopen)>.fbody{display:none}.card.fopen>.fsum{display:none}
.fsum{margin-top:8px;font-size:14px;color:var(--mut);line-height:1.4}.fsum.big{font-size:26px;letter-spacing:3px;line-height:1.2}
.card[data-fold]:not(.fopen){padding-bottom:16px}
.tgh{margin:14px 0 2px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#b98aa8}.tgh.late{color:#c0566f}
/* ===== Mode sobre ===== */
body.sober{--ink:#e7e0e6;--mut:#a69ca8;--card:#2a252d;--grad:#b88fa3;background:#1d1a1f;background-image:none;color:var(--ink)}
body.sober .card,body.sober .wday,body.sober .mday{background:#2a252d;border:1px solid #37303a;box-shadow:none;transform:none}
body.sober .card::before,body.sober .card::after,body.sober .stick,body.sober .deco,body.sober .pi::before{display:none}
body.sober .tab{background:#2a252d;color:#cfc6d0;border:1px solid #37303a;box-shadow:none;transform:none}
body.sober .tab.on{background:#4a3a45;color:#f3e9ef;transform:none}
body.sober h1,body.sober .card h2,body.sober .ph .wd{color:#efe6ec}
body.sober .kick{color:#c4a3b4}
body.sober .btn{background:#38313b;color:#e3d9e2}body.sober .btn.s{background:#322c35;color:#cbc1cb}
body.sober .btn.p{background:#6e5562;color:#fbf2f7;box-shadow:none}
body.sober .btn.d{background:#4a2f2f;color:#efc3bb}
body.sober input,body.sober select,body.sober textarea{background:#221e24;color:var(--ink);border-color:#3e3641}
body.sober .boost{background:#332c36;color:#e6dbe3;transform:none;border:0}
body.sober .bar{background:#3a333c}body.sober .bar>i{background:#b88fa3}
body.sober .chk{background:#221e24;border-color:#5b4f5c}body.sober .chk.on{background:#7fa794;border-color:#7fa794;color:#16241d}
body.sober .pill{background:#38313b;color:#d4c7d0}

</style></head><body>
<div id="book"><div id="page">
<header><div class="row"><div class="kick">✨ MON DAILY PLANNER</div><span class="sp"></span><button class="btn s modebtn" id="modeBtn" onclick="toggleSober()">🌙 Mode sobre</button></div><h1 id="ttl">Mon récap 🌷</h1>
</header>
<main id="app"></main>
<footer>Ma Semaine · tes données restent dans ce navigateur. Pense à sauvegarder 💾</footer>
</div></div>
<nav class="tabs" id="tabs"></nav>
<script>
const K='maSemaine_v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],done:{},stars:0,hist:[],memo:'',weights:[],sess:{},goal:3,cat:[{id:1,name:'Croquettes 🥣',buys:[]},{id:2,name:'Litière 🪣',buys:[]},{id:3,name:'Pâtée 🐟',buys:[]}],reviews:{}};
S.tasks.forEach(t=>{if(t.cat==='Admin')t.cat='Administratif'});
if(!S.postits){S.postits=S.memo?[{id:1,t:S.memo,c:0}]:[{id:1,t:'',c:0}]}
let SOBER=false;try{SOBER=localStorage.getItem('maSemaine_sober')==='1'}catch(e){}
function applySober(){document.body&&document.body.classList&&document.body.classList.toggle('sober',SOBER);const b=document.getElementById('modeBtn');if(b)b.textContent=SOBER?'🌸 Mode coloré':'🌙 Mode sobre';
  try{let m=document.querySelector('meta[name=theme-color]');if(m)m.content=SOBER?'#1d1a1f':'#fdf1f5'}catch(e){}}
function toggleSober(){SOBER=!SOBER;try{localStorage.setItem('maSemaine_sober',SOBER?'1':'0')}catch(e){}applySober()}
const STK_DEF=[['car','🚗','Conduite'],['shop','🛒','Courses'],['rdv','📅','Rendez-vous'],['doc','🩺','Médecin'],['psy','💬','Psy'],['gym','🏋️','Salle'],['sport','🏃‍♀️','Sport'],
 ['crea','🎨','Loisirs créatifs'],['croch','🧶','Crochet'],['trip','✈️','Voyage'],['out','🎉','Sortie prévue'],['diner','🍷','Dîner entre amis'],['cine','🎬','Cinéma'],
 ['buy','🛍️','Shopping'],['skin','🧴','Skincare'],['clean','🧹','Ménage'],['wash','🧺','Lessive'],['cat','🐱','Chat'],['duo','💕','Soirée à deux'],
 ['fam','👯','Amis / famille'],['resto','🍽️','Resto'],['rest','🛋️','Repos']].map(([id,e,n])=>({id,e,n}));
if(!S.stkDefs)S.stkDefs=STK_DEF;if(!S.stk)S.stk={};
if(!S.stkV2){if(!S.stkDefs.some(x=>x.id==='doc')){const i=S.stkDefs.findIndex(x=>x.id==='rdv');S.stkDefs.splice(i+1,0,{id:'doc',e:'🩺',n:'Médecin'})}S.stkV2=1}
const stkOf=ds=>(S.stk[ds]||[]).map(id=>S.stkDefs.find(x=>x.id===id)).filter(Boolean);
function toggleStk(ds,id){const a=S.stk[ds]||[];S.stk[ds]=a.includes(id)?a.filter(x=>x!==id):[...a,id];if(!S.stk[ds].length)delete S.stk[ds];save();render()}
let stkEdit=false;
function addStk(){openSheet(`<h3>Nouveau sticker</h3><span class="fl">Emoji</span><input id="f_se" placeholder="ex : 🎤" style="width:100px;font-size:24px;text-align:center" autofocus>
  <span class="fl">Nom</span><input id="f_sn" placeholder="ex : Karaoké">
  <div class="fbtns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveStk()">Ajouter</button></div>`)}
function saveStk(){const e=$v('f_se').trim(),n=$v('f_sn').trim();if(!e||!n){alert('Indique un emoji et un nom 🌸');return}
  S.stkDefs.push({id:'u'+uid(),e,n});stkEdit=false;save();closeSheet();render()}
function delStk(id){const d=S.stkDefs.find(x=>x.id===id);if(!confirm('Supprimer le sticker '+d.e+' '+d.n+' ?'))return;S.stkDefs=S.stkDefs.filter(x=>x.id!==id);for(const k in S.stk){S.stk[k]=S.stk[k].filter(x=>x!==id);if(!S.stk[k].length)delete S.stk[k]}save();render()}
function stickerCard(ds,title,key='stk'){const on=S.stk[ds]||[],mine=stkOf(ds);
  return `<div class="card"${FA(key,mine.length?mine.map(d=>d.e).join('  '):'Aucun sticker pour l’instant')}><div class="row"><h2 style="margin:0">${title}</h2><span class="sp"></span><button class="btn s" onclick="stkEdit=!stkEdit;render()">${stkEdit?'Terminé':'Modifier'}</button></div>
  <div class="mut" style="margin:4px 0 10px">${stkEdit?'Touche la croix pour retirer un sticker de la liste, ou ajoute le tien.':'Touche ce que tu fais ce jour-là, ça apparaît dans ta semaine et ton mois.'}</div>
  <div class="stks">${S.stkDefs.map(d=>stkEdit?`<button class="stk" onclick="delStk('${d.id}')"><span class="se">${d.e}</span><span class="sn">${esc(d.n)}</span><span class="sx">✕</span></button>`
    :`<button class="stk ${on.includes(d.id)?'on':''}" onclick="toggleStk('${ds}','${d.id}')"><span class="se">${d.e}</span><span class="sn">${esc(d.n)}</span></button>`).join('')}
  ${stkEdit?'<button class="stk add" onclick="addStk()"><span class="se">＋</span><span class="sn">Nouveau</span></button>':''}</div></div>`}
const stkLine=(ds,cls)=>{const l=stkOf(ds);return l.length?`<div class="${cls}">${l.map(d=>`<span title="${esc(d.n)}">${d.e}</span>`).join('')}</div>`:''};
if(!S.sub)S.sub={};if(!S.wish)S.wish=[];if(!S.created)S.created=Date.now();
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const CATS=['Perso','Maison','Administratif','Sport','Chat'];
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const uid=()=>Date.now()+Math.floor(Math.random()*999);
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
const monday=s=>{const d=P(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const isoWeek=s=>{const d=P(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const y=d.getFullYear();const j4=new Date(y,0,4);return{w:1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7),y}};
const weekStart=(w,y)=>{const j4=iso(new Date(y,0,4));return add(monday(j4),(w-1)*7)};
const weeksIn=y=>isoWeek(iso(new Date(y,11,28))).w;
const YEARS=()=>{const c=new Date().getFullYear(),a=[];for(let y=c-5;y<=c+3;y++)a.push(y);return a};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fr=s=>P(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='Accueil',curDay=TODAY(),curWeek=monday(TODAY()),curMonth=TODAY().slice(0,7);

function occurs(t,ds){
  if(!t.recur) return t.date===ds;
  if(ds<t.recur.start) return false;
  const d=P(ds),r=t.recur;
  if(r.type==='daily') return true;
  if(r.type==='weekly') return r.days.includes(d.getDay());
  if(r.type==='biweekly'){const w=Math.round((P(monday(ds))-P(monday(r.start)))/6048e5);return w%2===0&&r.days.includes(d.getDay())}
  if(r.type==='monthly') return d.getDate()===P(r.start).getDate();
  return false}
const tasksOn=ds=>S.tasks.filter(t=>occurs(t,ds)).sort((a,b)=>((b.prio?1:0)-(a.prio?1:0))||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0));
const isDone=(t,ds)=>!!S.done[t.id+'|'+ds];
function toggle(id,ds){const k=id+'|'+ds;if(S.done[k]){delete S.done[k];S.stars=Math.max(0,S.stars-1)}else{S.done[k]=Date.now();S.stars++;const t=S.tasks.find(x=>x.id==id);S.hist.unshift({t:t.title,d:Date.now(),est:t.dur,real:null})}save();render()}

function openSheet(html){let el=document.getElementById('sheet');if(!el){el=document.createElement('div');el.id='sheet';el.onclick=e=>{if(e.target===el)closeSheet()};document.body.appendChild(el)}
  el.innerHTML=`<div class="pan"><div class="grab"></div>${html}</div>`;el.classList.add('open');const f=el.querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),60)}
function closeSheet(){const el=document.getElementById('sheet');if(el){el.classList.remove('open');el.innerHTML=''}}
const $v=id=>{const e=document.getElementById(id);return e?e.value:''};
const $c=id=>{const e=document.getElementById(id);return !!(e&&e.checked)};
const $r=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:null};
function taskForm(t,o={}){const isNew=!t;t=t||{title:'',dur:null,cat:o.cat||'Perso',prio:false,date:o.date??null,recur:o.recur||null,time:'',subs:[]};
  const rec=t.recur,rt=rec?rec.type:'daily',days=rec?rec.days:[(P(TODAY()).getDay())];
  openSheet(`<h3>${isNew?(o.recur?'Nouvelle routine':'Nouvelle tâche'):'Modifier'}</h3>
  <input id="f_t" placeholder="Qu'est-ce que tu dois faire ?" value="${esc(t.title)}" ${isNew?'autofocus':''}>
  <span class="fl">Catégorie</span><div class="chips">${CATS.map(c=>`<label class="chip c-${c}"><input type="radio" name="f_cat" value="${c}" ${c===t.cat?'checked':''}><span>${c}</span></label>`).join('')}</div>
  <span class="fl">Durée (facultatif)</span><div class="row"><input id="f_d" type="number" inputmode="numeric" min="1" placeholder="minutes" value="${t.dur||''}" style="width:120px"><div class="qk">${[5,15,30,60].map(m=>`<button class="btn s" onclick="document.getElementById('f_d').value=${m}">${m} min</button>`).join('')}<button class="btn s" onclick="document.getElementById('f_d').value=''">Aucune</button></div></div>
  <span class="fl">Heure (facultatif, pour la frise du jour)</span><input id="f_h" type="time" value="${t.time||''}" style="width:150px">
  <span class="fl">Quand ?</span><div class="chips"><label class="chip"><input type="checkbox" id="f_rep" ${rec?'checked':''} onchange="document.getElementById('f_once').classList.toggle('hide2',this.checked);document.getElementById('f_recb').classList.toggle('hide2',!this.checked)"><span>🔁 Ça se répète</span></label>
   <label class="chip"><input type="checkbox" id="f_p" ${t.prio?'checked':''}><span>⭐ Prioritaire</span></label></div>
  <div id="f_once" class="${rec?'hide2':''}" style="margin-top:8px"><input id="f_date" type="date" value="${t.date||''}"><div class="mut" style="margin-top:4px">Laisse vide pour la mettre dans ta to-do générale.</div></div>
  <div id="f_recb" class="${rec?'':'hide2'}" style="margin-top:8px"><select id="f_fq" onchange="document.getElementById('f_days').classList.toggle('hide2',!['weekly','biweekly'].includes(this.value))">
   ${[['daily','Tous les jours'],['weekly','Certains jours chaque semaine'],['biweekly','Une semaine sur deux'],['monthly','Une fois par mois']].map(([v,l])=>`<option value="${v}" ${v===rt?'selected':''}>${l}</option>`).join('')}</select>
   <div id="f_days" class="chips ${['weekly','biweekly'].includes(rt)?'':'hide2'}" style="margin-top:8px">${[1,2,3,4,5,6,0].map(d=>`<label class="chip"><input type="checkbox" name="f_day" value="${d}" ${days.includes(d)?'checked':''}><span>${JOURS[d]}</span></label>`).join('')}</div>
   <div class="mut" style="margin-top:6px">À partir du <input id="f_start" type="date" value="${rec?rec.start:(o.date||TODAY())}" style="width:auto;display:inline-block;padding:4px 8px"></div></div>
  <span class="fl">Petites étapes (facultatif)</span><textarea id="f_s" placeholder="Une étape par ligne&#10;ex : vêtements&#10;bureau&#10;sol">${esc((t.subs||[]).map(x=>x.t).join('\n'))}</textarea>
  <div class="fbtns">${isNew?'':`<button class="btn d" onclick="closeSheet();delTask(${t.id})">Supprimer</button>`}<button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveTask(${isNew?'null':t.id})">Enregistrer</button></div>`)}
function saveTask(id){const title=$v('f_t').trim();if(!title){alert('Donne un nom à ta tâche 🌸');return}
  const t=id?S.tasks.find(x=>x.id==id):{id:uid()};const oldSubs=t.subs||[];
  t.title=title;t.cat=$r('f_cat')||'Perso';t.dur=parseInt($v('f_d'))||null;t.time=$v('f_h')||'';t.prio=$c('f_p');
  if($c('f_rep')){const type=$v('f_fq');let days=[...document.querySelectorAll('input[name="f_day"]:checked')].map(x=>+x.value);
    if(['weekly','biweekly'].includes(type)&&!days.length){alert('Choisis au moins un jour');return}
    t.recur={type,days,start:$v('f_start')||TODAY()};t.date=null}
  else{t.recur=null;t.date=$v('f_date')||null}
  t.subs=$v('f_s').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const o=oldSubs.find(y=>y.t===x);return o||{id:'s'+uid(),t:x}});
  if(!id)S.tasks.push(t);save();closeSheet();render()}
function newTask(o={}){taskForm(null,o)}
function newRoutine(){taskForm(null,{recur:{type:'daily',days:[],start:TODAY()}})}
function editTask(id){taskForm(S.tasks.find(x=>x.id==id))}
function dateSheet(title,def,cb,extra='',past=false){window._dcb=cb;openSheet(`<h3>${title}</h3>${extra}<input id="f_ds" type="date" value="${def}">
  <div class="qk"><button class="btn s" onclick="document.getElementById('f_ds').value=TODAY()">Aujourd'hui</button>${past?`<button class="btn s" onclick="document.getElementById('f_ds').value=add(TODAY(),-1)">Hier</button><button class="btn s" onclick="document.getElementById('f_ds').value=add(TODAY(),-2)">Avant-hier</button>`:`<button class="btn s" onclick="document.getElementById('f_ds').value=add(TODAY(),1)">Demain</button><button class="btn s" onclick="document.getElementById('f_ds').value=add(monday(TODAY()),7)">Lundi prochain</button>`}</div>
  <div class="fbtns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="const d=$v('f_ds');if(!d)return;closeSheet();window._dcb(d)">Valider</button></div>`)}
function planTask(id){dateSheet('Pour quel jour ?',TODAY(),d=>{S.tasks.find(x=>x.id==id).date=d;save();render()})}
function postpone(id){const t=S.tasks.find(x=>x.id==id);t.date=(!t.date||t.date<=TODAY())?add(TODAY(),1):add(t.date,1);save();render()}
function subKey(t,ds,sid){return t.id+'|'+(ds||'x')+'|'+sid}
function toggleSub(id,ds,sid){const t=S.tasks.find(x=>x.id==id),k=subKey(t,ds==='null'?null:ds,sid);if(S.sub[k])delete S.sub[k];else S.sub[k]=1;
  if(ds!=='null'&&t.subs.every(x=>S.sub[subKey(t,ds,x.id)])&&!isDone(t,ds)){save();toggle(id,ds);return}save();render()}
function subsHtml(t,ds){if(!t.subs||!t.subs.length)return'';return `<div class="subs">${t.subs.map(x=>{const on=!!S.sub[subKey(t,ds,x.id)];return `<div class="sub ${on?'on':''}"><button class="chk ${on?'on':''}" onclick="toggleSub(${t.id},'${ds}','${x.id}')">${on?'✓':''}</button><span>${esc(x.t)}</span></div>`}).join('')}</div>`}
const subCount=(t,ds)=>t.subs&&t.subs.length?`<span class="pill">${t.subs.filter(x=>S.sub[subKey(t,ds,x.id)]).length}/${t.subs.length} étapes</span>`:'';
function delTask(id){if(confirm('Supprimer cette tâche ?')){S.tasks=S.tasks.filter(x=>x.id!=id);save();render()}}


function taskRow(t,ds,opts=''){
  const dn=ds&&isDone(t,ds);
  return `<div class="task ${dn?'done':''}">${ds?`<button class="chk ${dn?'on':''}" onclick="toggle(${t.id},'${ds}')">${dn?'✓':''}</button>`:(!t.recur?`<button class="chk" onclick="doneUndated(${t.id})"></button>`:'')}
  <div class="sp"><div class="row"><span class="tt">${t.prio?'⭐ ':''}${esc(t.title)}</span><span class="sp"></span>${t.time?`<span class="pill">🕐 ${t.time}</span>`:''}${t.dur?`<span class="pill">${t.dur} min</span>`:''}</div>
  ${dn?subCount(t,ds):subsHtml(t,ds)}<div class="row" style="margin-top:6px"><span class="pill cat-${t.cat}">${t.cat}</span>${t.recur?'<span class="pill">🔁</span>':''}
  ${!dn?`<button class="btn s" onclick="startFocus(${t.id},'${ds||TODAY()}')">🎯 Focus</button>`:''}${ds&&!dn&&!t.recur?`<button class="btn s" onclick="postpone(${t.id})">${t.date<=TODAY()?'➡️ Demain':'➡️ +1 jour'}</button>`:''}${opts}
  <button class="btn s" onclick="editTask(${t.id})">Modifier</button></div></div></div>`}

function progressCard(ds){const l=tasksOn(ds),d=l.filter(t=>isDone(t,ds)).length,p=l.length?Math.round(d/l.length*100):0;
  return `<div class="card"><div class="row"><div><h2 style="margin:0">${p===100&&l.length?'Bravo ! 🎉':'Tu avances !'}</h2><div class="mut">${d} tâches sur ${l.length} terminées</div></div><span class="sp"></span><b style="font-size:30px">${p}%</b></div>
  <div class="bar" style="margin:12px 0 6px"><i style="width:${p}%"></i></div><div class="row mut"><span>${l.length-d} restantes</span><span class="sp"></span><span>⭐ ${S.stars} étoiles</span></div></div>`}
const MSG=['Une étape à la fois ! ✨','Même 5 minutes, ça compte 💗','Tu fais de ton mieux, et c\'est déjà beaucoup 🌸','Petit pas aujourd\'hui, grande fierté demain 🌷'];

function routineLine(t,ds){const dn=isDone(t,ds),st=streak(t);
  return `<div class="rline ${dn?'done':''}"><button class="chk ${dn?'on':''}" onclick="toggle(${t.id},'${ds}')">${dn?'✓':''}</button><span class="tt">${t.prio?'⭐ ':''}${esc(t.title)}${!dn?subsHtml(t,ds):''}</span>${t.time?`<span class="pill">🕐 ${t.time}</span>`:''}${dn?subCount(t,ds):''}${st?`<span class="pill">🔥 ${st}</span>`:''}${t.dur?`<span class="pill">${t.dur} min</span>`:''}${!dn?`<button class="btn s" onclick="startFocus(${t.id},'${ds}')">🎯</button>`:''}</div>`}
function vAccueil(){const ds=TODAY(),d=P(ds),all=tasksOn(ds),rt=all.filter(t=>t.recur),tk=all.filter(t=>!t.recur),done=all.filter(t=>isDone(t,ds)).length,pc=all.length?Math.round(done/all.length*100):0,rdone=rt.filter(t=>isDone(t,ds)).length;
  return `<div class="card"><span class="stick" style="right:14px;top:6px">🌷</span><span class="stick" style="right:52px;top:14px;font-size:20px">✨</span>
  <div class="ph"><div class="stamp"><div><b>${d.getDate()}</b><small>${['JANV','FÉV','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'][d.getMonth()]}</small></div></div>

function vProgres(){const nd=Object.keys(S.done).length,wc=weekCounts(8);
  const B=[[1,'🌱 Premier pas'],[5,'🍓 5 petites victoires'],[20,'🌸 20 tâches'],[50,'🦋 50 tâches'],[100,'👑 100 tâches']].filter(b=>nd>=b[0]);
  const focusH=S.hist.filter(h=>h.real!=null&&h.est);
  return `<div class="card"><h2>⭐ Étoiles et badges</h2><div class="row"><div class="stat">Étoiles<b>${S.stars} ⭐</b></div><div class="stat">Tâches faites<b>${nd}</b></div></div>
  <p><b>Mes badges</b></p>${B.map(b=>`<span class="badge">${b[1]}</span>`).join('')||'<span class="mut">Ton premier badge arrive vite !</span>'}</div>
  <div class="card"><h2>📈 Tâches faites par semaine</h2><div class="mut">Tes 8 dernières semaines.</div>${chart(wc,w=>P(w).getDate()+'/'+(P(w).getMonth()+1))}</div>
  <div class="card"${FA('tr-ser',(()=>{const r=S.tasks.filter(t=>t.recur).map(t=>[t,streak(t)]).sort((a,b)=>b[1]-a[1]);return r.length&&r[0][1]?`Meilleure série : ${r[0][0].title} 🔥 ${r[0][1]}`:'Pas encore de série en cours'})())}><h2>🔥 Mes séries</h2>${S.tasks.filter(t=>t.recur).map(t=>`<div class="task"><span class="sp">${esc(t.title)}</span><span class="pill">🔥 ${streak(t)}</span></div>`).join('')||'<p class="mut">Ajoute des routines pour voir tes séries.</p>'}</div>
  <div class="card"${FA('tr-est',focusH.length?focusH.length+' mesure'+(focusH.length>1?'s':'')+' · '+focusH.filter(h=>h.real<=h.est).length+' dans les temps 💪':'Pas encore de focus terminé')}><h2>⏱️ Estimé vs réel</h2><div class="mut">En mode focus, tu vois si tu estimes bien tes durées.</div>
  ${focusH.slice(0,15).map(h=>`<div class="task"><div class="sp"><div class="tt">${esc(h.t)}</div><div class="mut">${new Date(h.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} · estimé ${h.est} min · réel ${h.real} min ${h.real<=h.est?'💪':''}</div></div></div>`).join('')||'<p class="mut">Pas encore de focus terminé.</p>'}</div>`}

function sportDone(w){let c=0;for(let j=0;j<7;j++){const ds=add(w,j);S.tasks.forEach(t=>{if(t.cat==='Sport'&&isDone(t,ds))c++})}return c}
function planSport(){newTask({date:TODAY(),cat:'Sport'})}
function vSport(){const wk=monday(TODAY()),man=S.sess[wk]||0,n=man+sportDone(wk),ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  let svg='';if(ws.length>1){const v=ws.map(w=>w.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1;const pts=ws.map((w,i)=>`${i/(ws.length-1)*300},${110-(w.kg-mn)/(mx-mn)*100}`).join(' ');
    svg=`<svg viewBox="-5 0 310 120" style="width:100%;margin-top:10px"><defs><linearGradient id="g"><stop offset="0" stop-color="#f2a7c3"/><stop offset="1" stop-color="#c9b3f5"/></linearGradient></defs><polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${ws.map((w,i)=>`<circle cx="${i/(ws.length-1)*300}" cy="${110-(w.kg-mn)/(mx-mn)*100}" r="4" fill="#c9b3f5"/>`).join('')}</svg>`}
  const diff=ws.length>1?(ws[ws.length-1].kg-ws[0].kg).toFixed(1):null;
  const sw=[];for(let i=7;i>=0;i--){const w=add(wk,-7*i);sw.push([w,(S.sess[w]||0)+sportDone(w)])}
  return `<div class="card"><h2>💪 Séances cette semaine</h2><div class="row"><button class="btn" onclick="S.sess['${wk}']=Math.max(0,${man}-1);save();render()">−</button><b style="font-size:34px;margin:0 10px">${n}</b><span class="mut">/ objectif ${S.goal}</span><span class="sp"></span><button class="btn p" onclick="S.sess['${wk}']=${man}+1;S.stars++;save();render()">+ Séance</button></div>
  <div class="mut" style="margin-top:6px">Tes séances cochées dans le planning comptent toutes seules. Le + sert aux séances improvisées.</div>
  <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,n/S.goal*100)}%"></i></div>
  <button class="btn s" style="margin-top:10px" onclick="goalForm()">Changer l'objectif</button>
  ${chart(sw,w=>P(w).getDate()+'/'+(P(w).getMonth()+1))}</div>
  <div class="card"${FA('sp-plan',(()=>{let c=0,d=0;for(let j=0;j<7;j++){const x=add(wk,j);tasksOn(x).filter(t=>t.cat==='Sport').forEach(t=>{c++;if(isDone(t,x))d++})}return c?`${c} séance${c>1?'s':''} prévue${c>1?'s':''} · ${d} faite${d>1?'s':''}`:'Aucune séance prévue'})())}><div class="row"><h2 style="margin:0">📅 Séances prévues cette semaine</h2><span class="sp"></span><button class="btn" onclick="planSport()">+ Planifier</button></div>
  ${(()=>{const r=[];for(let j=0;j<7;j++){const ds=add(wk,j);tasksOn(ds).filter(t=>t.cat==='Sport').forEach(t=>r.push(`<div class="mut" style="margin-top:8px;text-transform:capitalize">${fr(ds)}</div>`+taskRow(t,ds)))}return r.join('')||'<p class="mut">Aucune séance prévue. Ajoute une tâche en catégorie Sport, ou appuie sur Planifier.</p>'})()}</div>
  <div class="card"${FA('sp-poids',ws.length?`Dernier : ${String(ws[ws.length-1].kg).replace('.',',')} kg`+(diff!==null?` · ${diff>0?'+':''}${String(diff).replace('.',',')} kg depuis le début`:''):'Aucune pesée')}><div class="row"><h2 style="margin:0">⚖️ Mon poids</h2><span class="sp"></span><button class="btn p" onclick="addWeight()">+ Ajouter</button></div>
  ${ws.length?`<div class="mut">Dernier : <b>${ws[ws.length-1].kg} kg</b>${diff!==null?` · ${diff>0?'+':''}${diff} kg depuis le début`:''}</div>`:'<p class="mut">Ajoute ta première pesée.</p>'}${svg}
  ${ws.slice(-6).reverse().map(w=>`<div class="task"><span class="sp">${fr(w.d)}</span><b>${w.kg} kg</b><button class="btn s" onclick="S.weights=S.weights.filter(x=>x.d!=='${w.d}');save();render()">✕</button></div>`).join('')}</div>`}

function addWeight(){openSheet(`<h3>Nouvelle pesée</h3><span class="fl">Poids (kg)</span><input id="f_kg" type="number" inputmode="decimal" step="0.1" autofocus>
  <span class="fl">Date</span><input id="f_wd" type="date" value="${TODAY()}">
  <div class="fbtns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveWeight()">Enregistrer</button></div>`)}
function saveWeight(){const k=parseFloat(($v('f_kg')||'').replace(',','.')),ds=$v('f_wd');if(!k||!ds){alert('Indique le poids et la date');return}
  S.weights=S.weights.filter(w=>w.d!==ds);S.weights.push({d:ds,kg:k});save();closeSheet();render()}
function catInfo(it){const b=[...it.buys].sort();if(b.length<2)return{avg:null,next:null};let s=0;for(let i=1;i<b.length;i++)s+=(P(b[i])-P(b[i-1]))/864e5;const avg=Math.round(s/(b.length-1));return{avg,next:add(b[b.length-1],avg)}}
function catAlerts(){return S.cat.map(it=>{const c=catInfo(it);if(!c.next)return'';const left=Math.round((P(c.next)-P(TODAY()))/864e5);return left<=3?`<div class="alert">🐱 ${esc(it.name)} : ${left<0?'normalement épuisé, pense à racheter !':left===0?'à racheter aujourd\'hui':'à racheter dans '+left+' jour'+(left>1?'s':'')}</div>`:''}).join('')}
function wishForm(id){const w=id?S.wish.find(x=>x.id==id):{name:'',price:'',link:''};
  openSheet(`<h3>${id?'Modifier':'Une envie d\'achat'}</h3><span class="fl">Quoi ?</span><input id="f_wn" value="${esc(w.name)}" placeholder="ex : Pull en laine" ${id?'':'autofocus'}>
  <span class="fl">Prix (€)</span><input id="f_wp" type="number" inputmode="decimal" step="0.01" value="${w.price??''}" style="width:140px">
  <span class="fl">Lien (facultatif)</span><input id="f_wl" type="url" value="${esc(w.link||'')}" placeholder="https://...">
  <div class="fbtns">${id?`<button class="btn d" onclick="delWish(${id})">Supprimer</button>`:''}<button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveWish(${id||'null'})">Enregistrer</button></div>`)}
function saveWish(id){const name=$v('f_wn').trim();if(!name){alert('Indique ce que tu veux acheter 🌸');return}
  const price=parseFloat(($v('f_wp')||'').replace(',','.'));const w=id?S.wish.find(x=>x.id==id):{id:uid(),added:TODAY(),bought:null};
  w.name=name;w.price=isNaN(price)?null:price;w.link=$v('f_wl').trim();if(!id)S.wish.push(w);save();closeSheet();render()}
function delWish(id){if(!confirm('Retirer cette envie de la liste ?'))return;S.wish=S.wish.filter(x=>x.id!=id);save();closeSheet();render()}
function buyWish(id){const w=S.wish.find(x=>x.id==id);w.bought=w.bought?null:TODAY();save();render()}
const eur=n=>n==null?'':n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
function wishCard(){const todo=S.wish.filter(w=>!w.bought),done=S.wish.filter(w=>w.bought).sort((a,b)=>a.bought<b.bought?1:-1);
  const tot=todo.reduce((a,w)=>a+(w.price||0),0),days=w=>Math.round((P(TODAY())-P(w.added))/864e5);
  return `<div class="card"${FA('ach-wish',todo.length?todo.length+' envie'+(todo.length>1?'s':'')+' · total '+eur(tot)+' · '+todo.slice(0,2).map(w=>w.name).join(' · '):'Aucune envie notée')}><div class="row"><h2 style="margin:0">🛍️ Mes envies</h2><span class="sp"></span><button class="btn p" onclick="wishForm()">+ Ajouter</button></div>
  <div class="mut" style="margin:4px 0 8px">Note ici ce que tu as envie d'acheter au lieu de le prendre tout de suite. Si l'envie est toujours là dans quelques jours, c'est peut-être une bonne idée.</div>
  ${todo.length?`<div class="row" style="margin-bottom:4px"><span class="lbl">Total : ${eur(tot)}</span></div>`:''}
  ${todo.map(w=>{const d=days(w);return `<div class="task"><div class="sp"><div class="row"><span class="tt">${esc(w.name)}</span><span class="sp"></span>${w.price!=null?`<span class="pill">${eur(w.price)}</span>`:''}</div>
   <div class="mut" style="margin-top:3px">${d<=0?'Ajouté aujourd\'hui':d===1?'Ajouté hier':'Ajouté il y a '+d+' jours'}${w.link?` · <a href="${esc(w.link)}" target="_blank" rel="noopener" style="color:#b0446f">voir le lien</a>`:''}</div>
   <div class="row" style="margin-top:6px"><button class="btn s" onclick="buyWish(${w.id})">✅ Acheté</button><button class="btn s" onclick="wishForm(${w.id})">Modifier</button></div></div></div>`}).join('')||'<p class="mut">Aucune envie notée pour l\'instant 🌸</p>'}
  ${done.length?`<details style="margin-top:10px"><summary class="mut">Déjà achetés (${done.length})</summary>${done.map(w=>`<div class="task done"><span class="sp tt">${esc(w.name)}</span>${w.price!=null?`<span class="pill">${eur(w.price)}</span>`:''}<button class="btn s" onclick="buyWish(${w.id})">Annuler</button></div>`).join('')}</details>`:''}</div>`}
function goalForm(){openSheet(`<h3>Objectif de la semaine</h3><span class="fl">Séances par semaine</span>
  <div class="chips">${[1,2,3,4,5,6,7].map(n=>`<label class="chip"><input type="radio" name="f_goal" value="${n}" ${n==S.goal?'checked':''}><span>${n}</span></label>`).join('')}</div>
  <div class="fbtns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveGoal()">Enregistrer</button></div>`)}
function saveGoal(){const g=parseInt($r('f_goal'));if(g){S.goal=g;save()}closeSheet();render()}
function catItemForm(){openSheet(`<h3>Nouvel article pour le chat</h3><span class="fl">Quoi ?</span><input id="f_ci" placeholder="ex : Friandises 🍬" autofocus>
  <div class="fbtns"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn p" onclick="saveCatItem()">Ajouter</button></div>`)}
function saveCatItem(){const n=$v('f_ci').trim();if(!n){alert('Indique le nom de l\'article 🐱');return}S.cat.push({id:uid(),name:n,buys:[]});save();closeSheet();render()}
function catBuyOn(id){dateSheet('Acheté quel jour ?',TODAY(),d=>{S.cat.find(x=>x.id==id).buys.push(d);save();render()},'',true)}
function vAchats(){return vChat()+wishCard()}
function vChat(){return catAlerts()+`<div class="card"${FA('ach-chat',(()=>{const n=S.cat.map(it=>[it,catInfo(it)]).filter(x=>x[1].next).sort((a,b)=>a[1].next<b[1].next?-1:1)[0];return n?`Prochain : ${n[0].name} vers le ${P(n[1].next).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`:S.cat.length+' articles suivis'})())}><div class="row"><h2 style="margin:0">🐱 Courses du chat</h2><span class="sp"></span><button class="btn" onclick="catItemForm()">+ Article</button></div>
  <div class="mut">Clique sur « Acheté » à chaque achat. Après 2 achats, je calcule ton rythme et je te préviens 3 jours avant.</div>
  ${S.cat.map(it=>{const c=catInfo(it),last=[...it.buys].sort().pop();return `<div class="task"><div class="sp"><div class="tt">${esc(it.name)}</div><div class="mut">${last?'Dernier achat : '+fr(last):'Jamais acheté encore'}${c.avg?` · tous les ~${c.avg} jours · prochain vers le ${P(c.next).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`:''}</div>
  <div class="row" style="margin-top:6px"><button class="btn p" onclick="S.cat.find(x=>x.id==${it.id}).buys.push(TODAY());save();render()">🛒 Acheté</button><button class="btn s" onclick="catBuyOn(${it.id})">Autre date</button><button class="btn s" onclick="if(confirm('Supprimer ?')){S.cat=S.cat.filter(x=>x.id!=${it.id});save();render()}">Supprimer</button></div></div></div>`}).join('')}</div>`}

function vReglages(){const ns=notifState();return `<div class="card"><h2>🔔 Alertes</h2>
  <div class="mut">Un rappel 10 minutes avant et à l'heure de tes tâches avec une heure, et à la fin du minuteur Focus.</div>
  <div class="alert" style="margin-top:10px">Ça marche quand l'appli est ouverte ou vient d'être quittée. Si l'iPad la met en veille, les alertes ne partent plus : pour un rappel important, utilise aussi Rappels d'Apple.</div>
  ${ns==='granted'?'<p><b>✅ Alertes activées</b></p>':ns==='denied'?'<p class="mut">Alertes refusées. Pour les réactiver : Réglages de l\'iPad → Notifications → Ma Semaine.</p>':`<button class="btn p" style="width:100%" onclick="askNotif()">Autoriser les alertes</button>`}</div>
  <div class="card"><h2>💾 Sauvegarde</h2><div class="mut">Dernière sauvegarde : ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):'jamais'}</div><div class="mut">Crée un fichier avec toutes tes données (range-le dans iCloud Drive), puis importe-le sur ton autre appareil.</div>
  <div class="row" style="margin-top:10px"><button class="btn p" onclick="exportData()">Sauvegarder</button><label class="btn">Importer<input type="file" accept=".json,application/json" class="hide" onchange="importData(this.files[0])"></label></div>
  <button class="btn d" style="margin-top:14px;width:100%" onclick="if(confirm('Tout effacer ? Pense à sauvegarder avant.')){localStorage.removeItem('${K}');location.reload()}">Réinitialiser les données</button></div>`}
async function exportData(){const name='ma-semaine-'+TODAY()+'.json',txt=JSON.stringify(S);
  const done=()=>{S.lastBackup=Date.now();S.backupSnooze=0;save();render()};
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Ma Semaine'});done();return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();done()}
function backupCard(){const now=Date.now(),last=S.lastBackup||0,days=Math.floor((now-(last||S.created))/864e5);
  if((S.backupSnooze||0)>now)return'';if(last?days<7:days<3)return'';if(!S.tasks.length)return'';
  return `<div class="backup"><b>💾 Petite sauvegarde ?</b><div class="mut" style="margin:4px 0 10px">${last?`Ta dernière sauvegarde date de ${days} jours.`:'Tu n\'as encore jamais sauvegardé.'} Tes données ne sont que dans cet appareil, un fichier dans iCloud Drive les met à l'abri.</div>
  <div class="row"><button class="btn p" onclick="exportData()">Sauvegarder maintenant</button><button class="btn s" onclick="S.backupSnooze=Date.now()+2*864e5;save();render()">Plus tard</button></div></div>`}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks)throw 0;if(confirm('Remplacer les données de cet appareil par celles du fichier ?')){S=d;save();render();alert('Importé ! 🎉')}}catch(e){alert('Fichier non reconnu 😕')}};r.readAsText(f)}

const TITLES={Accueil:'Mon récap',Routines:'Mes routines',Mois:'Mon mois',Semaine:'Ma semaine',Jour:'Ma journée','To-do':'À faire',Focus:'Mon focus','Trophées':'Mes trophées',Sport:'Mon sport',Achats:'Mes achats','Réglages':'Mes réglages'};
const TABS={Accueil:['🏡',vAccueil],Routines:['🔁',vRoutines],Mois:['🗓️',vMois],Semaine:['📆',vSemaine],Jour:['☀️',vJour],'To-do':['📝',vTodo],Focus:['🎯',vFocus],'Trophées':['🏆',vProgres],Sport:['💪',vSport],Achats:['🛍️',vAchats],'Réglages':['💾',vReglages]};
let turning=false;
function go(t){if(t===tab){scrollTo(0,0);return}const keys=Object.keys(TABS),fwd=keys.indexOf(t)>keys.indexOf(tab),pg=document.getElementById('page');
  const anim=pg&&pg.cloneNode&&!turning&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  let ov=null;
  if(anim&&fwd){scrollTo(0,0);ov=pg.cloneNode(true);ov.removeAttribute('id');ov.className='turn';ov.style.height=Math.min(pg.offsetHeight,innerHeight+200)+'px';
    ov.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));document.getElementById('book').appendChild(ov)}
  tab=t;render();scrollTo(0,0);
  if(anim){turning=true;if(fwd){requestAnimationFrame(()=>ov.classList.add('fwd'));setTimeout(()=>{ov.remove();turning=false},600)}
    else{pg.classList.remove('back');void pg.offsetWidth;pg.classList.add('back');setTimeout(()=>{pg.classList.remove('back');turning=false},600)}}}
let TLS=null;
const FA=(k,sum)=>` data-fold="${k}" data-sum="${esc(sum)}"`;
const firstTitles=(l,n=2)=>l.slice(0,n).map(t=>t.title).join(' · ')+(l.length>n?` · +${l.length-n}`:'');
function foldify(){try{if(!S.fold)S.fold={};document.querySelectorAll('#app .card[data-fold]').forEach(c=>{const k=c.dataset.fold,head=c.firstElementChild;if(!head||c.querySelector(':scope>.fbody'))return;
  const body=document.createElement('div');body.className='fbody';while(head.nextSibling)body.appendChild(head.nextSibling);
  const sm=document.createElement('div');sm.className='fsum'+(/[a-zà-ÿ]/i.test(c.dataset.sum)?'':' big');sm.textContent=c.dataset.sum;c.appendChild(sm);c.appendChild(body);
  head.classList.add('fhead');const h2=head.matches('h2')?head:head.querySelector('h2');if(h2){const ch=document.createElement('span');ch.className='chev';ch.textContent='›';h2.appendChild(ch)}
  if(S.fold[k])c.classList.add('fopen');
  head.addEventListener('click',e=>{if(e.target.closest('button,input,select,a,label,textarea'))return;S.fold[k]=!S.fold[k];save();c.classList.toggle('fopen',!!S.fold[k]);
    if(S.fold[k]){c.querySelectorAll('.pi textarea').forEach(growPi);c.querySelectorAll('.tlw').forEach(w=>{w.scrollTop=(TLS&&TLS.ds===w.dataset.ds)?TLS.top:+w.dataset.start})}})})}catch(e){}}
function growPi(e){e.style.height='auto';e.style.height=Math.max(104,Math.ceil(e.scrollHeight/26)*26)+'px'}
function render(){try{applySober()}catch(e){}try{const h=document.getElementById('ttl');if(h)h.textContent=(TITLES[tab]||'Ma Semaine')+' 🌷'}catch(e){}document.getElementById('tabs').innerHTML=Object.entries(TABS).map(([k,v],i)=>`<button class="tab t${i} ${k===tab?'on':''}" onclick="go('${k}')"><span class="ic">${v[0]}</span>${k}</button>`).join('');document.getElementById('app').innerHTML=TABS[tab][1]();try{document.querySelectorAll('.pi textarea').forEach(growPi)}catch(e){}foldify();try{document.querySelectorAll('.tlw').forEach(w=>{if(!w.offsetParent)return;w.scrollTop=(TLS&&TLS.ds===w.dataset.ds)?TLS.top:+w.dataset.start;TLS={ds:w.dataset.ds,top:w.scrollTop}})}catch(e){}}
render();
</script></body></html>
