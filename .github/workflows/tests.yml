name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright et Chrome
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Lancer les tests (synchro, sauvegardes, sécurité, hors ligne)
        run: python tests/run_tests.py
